# Module options, read by kmodloader (which is also OpenWrt's modprobe)
# before it loads anything.
#
# Syntax:  options <module> <param>=<value>
#          blacklist <module>

# Ring the MHI channel doorbell on every queued buffer instead of only when
# the modem asks for it.
#
# Without this the downlink deadlocks under sustained load, in practice
# somewhere past 200 Mbps: the host fills all 127 RX descriptors, the modem
# never re-arms the burst-mode doorbell, and rx stops dead for tens of
# seconds while tx keeps flowing. Captured and analysed in
# x3000/docs/downlink-stall.md.
#
# The parameter itself comes from
# target/linux/mediatek/patches-6.12/993-bus-mhi-host-optional-doorbell-write.patch
# and defaults to off, so this line is what enables it on this board.
#
# This file, not the kernel command line, is the place for it: mhi is a
# loadable module here (kmod-mhi-bus) and kmodloader never reads
# /proc/cmdline, so an "mhi.force_db_brst_disable=1" bootarg would be
# silently ignored.
#
# Worth knowing before editing this again: /etc/modules.conf is a ubox
# conffile. Once this modified copy is on the router, sysupgrade backs it up
# and restores it, so a newer version baked into a later image will not
# replace it. Change it on the device as well, or flash with -n.
options mhi force_db_brst_disable=1
