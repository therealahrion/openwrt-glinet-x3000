# Endpoint TCP tuning for the router's OWN connections. Like BBR, these
# affect only TCP the router itself originates (its downloads/updates) —
# forwarded client flows negotiate these end-to-end themselves. Both are
# kernel defaults, pinned explicitly for clarity + to guard the value.
#   tcp_sack  = selective ACK: fast, targeted loss recovery — worthwhile
#               on the lossy/variable 5G uplink for on-box transfers.
#   tcp_dsack = duplicate SACK: lets the sender detect spurious retransmits.
# (tcp_fack is intentionally NOT set — removed from modern kernels,
#  superseded by RACK-TLP, which is on by default and needs no sysctl.)
# Other endpoint/QoS sysctls (ECN, early-demux, fastopen, netdev_budget)
# are deliberately left to the measure-first cookbook in docs/ — not
# baked, because they are behavioral choices best applied and tested one
# at a time after baselining.
net.ipv4.tcp_sack=1
net.ipv4.tcp_dsack=1
