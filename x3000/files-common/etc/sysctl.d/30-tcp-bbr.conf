# TCP congestion control for the router's OWN traffic — status + opt-out.
#
# BBR is ALREADY the boot default on this image: the kmod-tcp-bbr package
# ships /etc/sysctl.d/12-tcp-bbr.conf (active — an OpenWrt packaging
# default, true since vjt's builds) which sets
# net.ipv4.tcp_congestion_control=bbr at boot. In this build `bbr` is
# Google's BBRv3, via target/linux/mediatek/patches-6.12/990-tcp-bbr3.patch.
# The kernel's compiled-in default (CUBIC) only covers the instant before
# the sysctl service runs (START=11).
#
# This file is the documented OPT-OUT: it sorts after 12-tcp-bbr.conf, so
# uncommenting the last line reverts the router's own TCP to CUBIC — then
# `service sysctl restart` (no reboot needed). /etc/sysctl.conf is read
# last of all and overrides everything, if you'd rather put it there.
#
# Scope: congestion control set here affects only TCP the router itself
# originates (its own downloads, updates, on-box tools). Forwarded
# LAN-client traffic is governed by the endpoints — set BBR on the gaming
# PC, not here.
#
#net.ipv4.tcp_congestion_control=cubic
