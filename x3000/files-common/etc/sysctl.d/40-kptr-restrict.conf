# Let root read real kernel pointers from %pK-formatted files.
#
# The MHI debugfs channel dump prints the driver's own ring pointers through
# %pK. At the default setting those come back hashed, and wanlog/dlwatch then
# record -1 for dl_qd and dl_free - the two columns that actually answer "did
# the host run out of buffers". Setting 1 makes them readable again.
#
# Safe here: 1 only lifts the hashing for readers holding CAP_SYSLOG, and the
# files in question live under /sys/kernel/debug, which is root-only anyway.
# This router has no unprivileged users. Comment the line out to go back.
kernel.kptr_restrict=1
