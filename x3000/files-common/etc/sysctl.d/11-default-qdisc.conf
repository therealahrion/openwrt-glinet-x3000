# Default qdisc pinned to fq_codel — which is ALSO the kernel compiled
# default (CONFIG_DEFAULT_FQ_CODEL=y), so this is an explicit, no-op-safe
# pin, not a change. (An earlier revision set 'fq' to pair with BBR;
# reverted 2026-09-05 — fq_codel is the better general default for a
# forwarding router's AQM, and the WAN's cake under SQM overrides the
# default on the path that actually matters.)
net.core.default_qdisc=fq_codel
