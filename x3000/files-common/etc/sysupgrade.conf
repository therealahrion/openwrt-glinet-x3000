## This file contains files and directories that should
## be preserved during an upgrade.

# /etc/example.conf
# /etc/openvpn/

# Keep /root across sysupgrades — backup key (~/.ssh/backup), known_hosts,
# and /root/bin/backup.sh live here. Without this they get wiped on every
# sysupgrade and the daily backup cron quietly stops working.
/root

# Keep the first-boot defaults marker. /etc/config/x3000 belongs to no
# package, so it is not a conffile and sysupgrade would not carry it on its
# own; without it the marker resets and 93-irqbalance / 95-wireless would
# re-apply over settings changed in LuCI. See /lib/x3000/defaults.sh.
/etc/config/x3000

# Keep the wireless config. It is generated at first boot by `wifi config`
# rather than shipped by a package, so it appears in no *.conffiles_static
# and in no /lib/upgrade/keep.d entry - checked against wifi-scripts, which
# declares no conffiles at all. Listing it here makes SSIDs, channels and
# keys survive a settings-keeping sysupgrade regardless of how much of the
# overlay that upgrade carried.
/etc/config/wireless
