# Feeds configuration for the GL.iNet GL-X3000 build. Copied verbatim to
# /feeds.conf by x3000/prepare.sh. The first five lines are the standard
# OpenWrt 25.12 feeds; the last is the local symlink dir populated from
# x3000/custom-feeds.txt.
src-git packages https://git.openwrt.org/feed/packages.git;openwrt-25.12
src-git luci https://git.openwrt.org/project/luci.git;openwrt-25.12
src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12
src-git telephony https://git.openwrt.org/feed/telephony.git;openwrt-25.12
src-git video https://github.com/openwrt/video.git;openwrt-25.12
src-link custom feeds-local
# QModem feed — Quectel vendor pcie_mhi driver (stock-firmware-style
# /dev/mhi_* nodes), qmodem dialer/AT stack + luci-app-qmodem UI, plus
# qfirehose 1.4.21 (this build's modem-firmware flasher; vjt's older
# qfirehose fork was dropped from custom-feeds.txt in favour of it).
# Pinned to a commit for reproducible builds; bump deliberately.
src-git qmodem https://github.com/FUjr/QModem.git^c1db0fe2067955d6b9c6b43efff1b69259f4b096
