name: Build X3000 image

# Builds the public-variant GL-X3000 sysupgrade image (OpenWrt 25.12,
# kernel 6.12): vjt's stock modem stack (ModemManager + mainline MHI)
# plus the lean optimization overlay — see x3000/docs/lean-overlay.md.
#
#   * manual runs:  Actions tab -> "Build X3000 image" -> Run workflow
#   * tag runs:     push a tag matching x3000-r* (e.g. x3000-r1) to also
#                   get a draft prerelease with the artifacts attached
#
# The private variant is intentionally not built here — its overlay
# (x3000/files-private/, *.local configs) is gitignored and never
# reaches CI.

on:
  workflow_dispatch:
  push:
    tags:
      - "x3000-r*"

permissions:
  contents: write

concurrency:
  group: x3000-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build public image
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ \
            gawk gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd

      # config.common expects a host Go toolchain at /usr/local/go
      # (CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT). GitHub runners ship Go;
      # make sure it's reachable at that path.
      - name: Ensure Go bootstrap at /usr/local/go
        run: |
          if [ ! -e /usr/local/go ]; then
            sudo ln -s "$(go env GOROOT)" /usr/local/go
          fi
          /usr/local/go/bin/go version

      - name: Cache source downloads (dl/)
        uses: actions/cache@v4
        with:
          path: dl
          key: x3000-dl-${{ github.run_id }}
          restore-keys: |
            x3000-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: x3000-ccache-${{ github.run_id }}
          restore-keys: |
            x3000-ccache-

      - name: Prepare build tree (public variant)
        run: |
          ./x3000/prepare.sh public
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig

      # Fail fast (before ~4h of compiling) if the composition is wrong:
      # vjt's stock modem stack must be in, the lean overlay must be in,
      # and the excluded stacks (QModem, qosify/sqm, tc-tiny) out. Anything
      # that needs both a package and a first-boot default to do its job gets
      # both halves gated, because a missing overlay file fails silently.
      - name: Sanity-check composed .config
        run: |
          set -e
          for s in modemmanager kmod-mhi-pci-generic luci-proto-modemmanager quectel-5g-tools \
                   kmod-tcp-bbr kmod-sched-cake kmod-sched-bpf kmod-ifb tc-bpf libbpf \
                   bpftool-full xdp-loader xdpdump fping kmod-wireguard luci-proto-wireguard \
                   kmod-zram zram-swap irqbalance luci-app-irqbalance \
                   fantastic-keyring fantastic-packages-feeds; do
            grep -q "^CONFIG_PACKAGE_$s=y" .config || { echo "missing: $s" >&2; exit 1; }
          done
          for s in qmodem kmod-pcie_mhi qosify sqm-scripts luci-app-sqm tc-tiny ply; do
            if grep -q "^CONFIG_PACKAGE_$s=y" .config; then echo "leaked in: $s" >&2; exit 1; fi
          done
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-x3000=y' .config
          # zram: the CONFIG_KERNEL_ZRAM_BACKEND_* symbols are the real lever.
          # They are what pull kmod-lib-lzo/lz4/zstd in AND what lets zram use
          # them; selecting the kmod-lib-* packages alone would build modules
          # zram cannot reach. LZO needs stating explicitly because enabling
          # LZ4 or ZSTD cancels kmod-zram's FORCE_LZO auto-select.
          for k in ZRAM_BACKEND_LZO ZRAM_BACKEND_LZ4 ZRAM_BACKEND_ZSTD \
                   ZRAM_DEF_COMP_LZORLE; do
            grep -q "^CONFIG_KERNEL_$k=y" .config \
              || { echo "missing kernel symbol: $k" >&2; exit 1; }
          done
          # Every one of these is inert without its first-boot default: the
          # wwan interface does not exist, zram needs enabling, irqbalance
          # ships enabled='0', packet steering has no value on a fresh flash,
          # and the wireless sections ship with OpenWrt's own SSID.
          for u in 90-wwan-interface 91-gateway-metrics 92-zram-swap \
                   93-irqbalance 94-packet-steering 95-wireless; do
            test -f "x3000/files-common/etc/uci-defaults/$u" \
              || { echo "missing uci-default: $u" >&2; exit 1; }
          done
          # The marker helper that 92/93/95 source, and the hotplug script
          # that fills in network.wwan.device once the modem enumerates.
          test -f x3000/files-common/lib/x3000/defaults.sh
          test -f x3000/files-common/etc/hotplug.d/wwan/20-wwan-device
          # Guard against the old dormant-zram script coming back: it and
          # 92-zram-swap would fight, and disable would win by running later.
          test ! -e x3000/files-common/etc/uci-defaults/99-zram-disabled
          # /etc/config/x3000 holds the applied-once markers and belongs to no
          # package, so sysupgrade only carries it if it is listed. Without
          # that, 93 and 95 re-apply over settings changed in LuCI.
          grep -qx '/etc/config/x3000' x3000/files-common/etc/sysupgrade.conf
          grep -qx '/etc/config/wireless' x3000/files-common/etc/sysupgrade.conf
          # The composed overlay has to actually carry the new trees --
          # prepare.sh rebuilds files/ from scratch on every run.
          test -f files/lib/x3000/defaults.sh
          test -f files/etc/hotplug.d/wwan/20-wwan-device
          # The diagnostic tools are run by name, so they have to ship +x. A
          # Windows checkout runs git with core.filemode=false and loses the
          # bit; prepare.sh restores it when composing files/. Gate on the
          # result rather than the source, because an unrunnable script on the
          # box fails in a way that looks exactly like success.
          for t in wanlog dlwatch collect-logs; do
            test -x "files/usr/bin/$t" || { echo "not executable: files/usr/bin/$t" >&2; exit 1; }
          done
          echo "config OK"

      - name: Download sources
        run: make -j"$(nproc)" download

      - name: Build
        run: |
          make -j"$(nproc)" BIN_DIR="$PWD/bin-x3000-public" \
            || make -j1 V=s BIN_DIR="$PWD/bin-x3000-public"

      - name: Collect artifacts
        run: |
          set -e
          # BIN_DIR is the *leaf* output directory in OpenWrt: rules.mk sets it
          # to $(OUTPUT_DIR)/targets/$(BOARD)/$(SUBTARGET), so overriding it in
          # the build step puts the images flat here, not under a targets/
          # subtree. Getting this wrong fails the job after the whole build.
          TDIR=bin-x3000-public
          mkdir -p out
          cp "$TDIR"/openwrt-mediatek-filogic-glinet_gl-x3000-squashfs-sysupgrade.bin out/
          cp "$TDIR"/openwrt-mediatek-filogic-glinet_gl-x3000.manifest out/ || true
          cp "$TDIR"/config.buildinfo out/ || true
          cp "$TDIR"/version.buildinfo out/ || true
          (cd out && sha256sum -- * > sha256sums)
          ls -la out/

      # Catch silent image growth, and a truncated or stub image, before the
      # artifact is published. The private variant measured 92,559,637 bytes
      # (88.3 MiB) on 2026-09-10 with telegraf-full baked in; the public
      # variant carries neither telegraf nor the private overlay, so it should
      # sit well below that. The ceiling starts deliberately loose - tighten it
      # once a public build has printed its real size in this log. The floor is
      # there because a stub image is a worse failure than a fat one and would
      # otherwise upload cleanly.
      - name: Check image size
        env:
          MAX_IMAGE_BYTES: "100663296"
          MIN_IMAGE_BYTES: "8388608"
        run: |
          set -e
          IMG=out/openwrt-mediatek-filogic-glinet_gl-x3000-squashfs-sysupgrade.bin
          BYTES=$(stat -c %s "$IMG")
          echo "sysupgrade image: $BYTES bytes ($((BYTES / 1048576)) MiB)"
          if [ "$BYTES" -gt "$MAX_IMAGE_BYTES" ]; then
            echo "image is larger than MAX_IMAGE_BYTES=$MAX_IMAGE_BYTES" >&2
            exit 1
          fi
          if [ "$BYTES" -lt "$MIN_IMAGE_BYTES" ]; then
            echo "image is smaller than MIN_IMAGE_BYTES=$MIN_IMAGE_BYTES -- truncated?" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x3000-public-image-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/x3000-r')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: out/*
