name: Build X3000 image

# Builds the public-variant GL-X3000 sysupgrade image (OpenWrt 25.12,
# kernel 6.12, QModem vendor pcie_mhi modem stack).
#
#   * manual runs:  Actions tab -> "Build X3000 image" -> Run workflow
#   * tag runs:     push a tag matching x3000-r* (e.g. x3000-r1) to also
#                   get a draft prerelease with the artifacts attached
#
# The private variant is intentionally not built here — its overlay
# (x3000/files-private/, *.local configs) is gitignored and never
# reaches CI.

on:
  workflow_dispatch:
  push:
    tags:
      - "x3000-r*"

permissions:
  contents: write

concurrency:
  group: x3000-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build public image
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ \
            gawk gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd

      # config.common expects a host Go toolchain at /usr/local/go
      # (CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT). GitHub runners ship Go;
      # make sure it's reachable at that path.
      - name: Ensure Go bootstrap at /usr/local/go
        run: |
          if [ ! -e /usr/local/go ]; then
            sudo ln -s "$(go env GOROOT)" /usr/local/go
          fi
          /usr/local/go/bin/go version

      - name: Cache source downloads (dl/)
        uses: actions/cache@v4
        with:
          path: dl
          key: x3000-dl-${{ github.run_id }}
          restore-keys: |
            x3000-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: x3000-ccache-${{ github.run_id }}
          restore-keys: |
            x3000-ccache-

      - name: Prepare build tree (public variant)
        run: |
          ./x3000/prepare.sh public
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig

      # Fail fast (before ~4h of compiling) if the modem stack composed
      # wrong: vendor pcie_mhi must be in, the mainline MHI/MM stack out.
      - name: Sanity-check composed .config
        run: |
          set -e
          grep -q '^CONFIG_PACKAGE_kmod-pcie_mhi=y' .config
          grep -q '^CONFIG_PACKAGE_qmodem=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-qmodem=y' .config
          grep -q '^CONFIG_PACKAGE_quectel-CM-5G-M=y' .config
          if grep -q '^CONFIG_PACKAGE_kmod-mhi-pci-generic=y' .config; then
            echo "mainline kmod-mhi-pci-generic leaked into the config" >&2
            exit 1
          fi
          if grep -q '^CONFIG_PACKAGE_modemmanager=y' .config; then
            echo "modemmanager leaked into the config" >&2
            exit 1
          fi
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-x3000=y' .config
          echo "config OK"

      - name: Download sources
        run: make -j"$(nproc)" download

      - name: Build
        run: |
          make -j"$(nproc)" BIN_DIR="$PWD/bin-x3000-public" \
            || make -j1 V=s BIN_DIR="$PWD/bin-x3000-public"

      - name: Collect artifacts
        run: |
          set -e
          TDIR=bin-x3000-public/targets/mediatek/filogic
          mkdir -p out
          cp "$TDIR"/openwrt-mediatek-filogic-glinet_gl-x3000-squashfs-sysupgrade.bin out/
          cp "$TDIR"/openwrt-mediatek-filogic-glinet_gl-x3000.manifest out/ || true
          cp "$TDIR"/config.buildinfo out/ || true
          cp "$TDIR"/version.buildinfo out/ || true
          (cd out && sha256sum -- * > sha256sums)
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x3000-public-image-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/x3000-r')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: out/*
